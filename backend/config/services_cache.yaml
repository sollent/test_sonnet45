# Professional Redis Cache Services Configuration
# Include this in your main services.yaml

services:
    # Redis connection - create the actual Redis/RedisCluster connection
    redis.connection:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    # Custom Redis adapter that we'll use directly
    app.redis.adapter:
        class: Symfony\Component\Cache\Adapter\RedisTagAwareAdapter
        public: true
        arguments:
            - '@redis.connection'
            - 'app_cache_'  # namespace prefix
            - 900 # default lifetime

    # Redis Key Manager
    App\Service\Cache\RedisKeyManager:
        arguments:
            $environment: '%kernel.environment%'

    # Main Redis Cache Service
    App\Service\Cache\RedisCacheService:
        public: true  # Make it public for testing
        arguments:
            $redisAdapter: '@app.redis.adapter'  # Use our custom Redis adapter
            $keyManager: '@App\Service\Cache\RedisKeyManager'
            $logger: '@logger'
            $defaultTtl: 900

    # Alias for interface
    App\Service\Cache\Interface\CacheServiceInterface:
        alias: App\Service\Cache\RedisCacheService

    App\Service\Cache\Interface\CacheKeyManagerInterface:
        alias: App\Service\Cache\RedisKeyManager

    # Task Cache Service (uses SimpleRedisCache)
    App\Service\Cache\TaskCacheService:
        public: true  # Make it public for testing
        arguments:
            $cacheService: '@App\Service\Cache\SimpleRedisCache'
            $keyManager: '@App\Service\Cache\RedisKeyManager'

    # Analytics Cache Service (uses SimpleRedisCache)
    App\Service\Cache\AnalyticsCacheService:
        public: true  # Make it public for testing
        arguments:
            $cacheService: '@App\Service\Cache\SimpleRedisCache'
            $keyManager: '@App\Service\Cache\RedisKeyManager'
