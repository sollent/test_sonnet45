# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true
    default_locale: 'ru'
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: 'ru'

    # Cache Configuration
    cache:
        # Default cache app - using filesystem for system cache
        app: cache.adapter.filesystem
        system: cache.adapter.system
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # Main Redis adapter pool (for RedisCacheService)
            app.cache.redis:
                adapter: cache.adapter.redis_tag_aware
                provider: '%env(REDIS_URL)%'
                tags: true
                default_lifetime: 900
            # Analytics cache for dashboard data
            cache.analytics:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'
                default_lifetime: 900  # 15 minutes
            # Task cache for user-specific data
            cache.tasks:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'
                default_lifetime: 300  # 5 minutes
            # Doctrine system caches - use filesystem to avoid circular deps
            doctrine.metadata_cache_pool:
                adapter: cache.adapter.filesystem
            doctrine.query_cache_pool:
                adapter: cache.adapter.filesystem
            doctrine.result_cache_pool:
                adapter: cache.adapter.filesystem

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
