# Валидация задач
task:
  title:
    not_blank: "Название задачи обязательно"
    min_length: "Название задачи должно содержать минимум 1 символ"
    max_length: "Название задачи не должно превышать 255 символов"
  description:
    max_length: "Описание задачи не должно превышать 5000 символов"
  due_date:
    must_be_after_start: "Дата завершения должна быть позже даты начала"

# Валидация тегов
tag:
  name:
    not_blank: "Название тега обязательно"
    min_length: "Название тега должно содержать минимум 1 символ"
    max_length: "Название тега не должно превышать 50 символов"
    invalid_format: "Название тега содержит недопустимые символы"
    already_exists: "Тег с таким названием уже существует"
  color:
    not_blank: "Цвет тега обязателен"
    invalid_format: "Неверный формат цвета. Используйте hex формат, например #3B82F6"

# Стандартные сообщения валидации Symfony
This value should not be blank.: "Это поле не может быть пустым."
This value is not a valid email address.: "Пожалуйста, введите корректный email адрес."
This value is too short. It should have {{ limit }} character or more.|This value is too short. It should have {{ limit }} characters or more.: "Значение слишком короткое. Минимальная длина - {{ limit }} символ.|Значение слишком короткое. Минимальная длина - {{ limit }} символа.|Значение слишком короткое. Минимальная длина - {{ limit }} символов."
This value is too long. It should have {{ limit }} character or less.|This value is too long. It should have {{ limit }} characters or less.: "Значение слишком длинное. Максимальная длина - {{ limit }} символ.|Значение слишком длинное. Максимальная длина - {{ limit }} символа.|Значение слишком длинное. Максимальная длина - {{ limit }} символов."

