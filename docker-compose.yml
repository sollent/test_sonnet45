# Main Docker Compose - Includes base config only
# Location: /test_sonnet45/docker-compose.yml

version: '3.8'

# Include only base infrastructure (БЕЗ fallback - Fail-Fast принцип!)
include:
  # Main application services (backend, database, queue)
  # БЕЗ fallback - Fail-Fast принцип!
  - path: ./infrastructure/docker/docker-compose.app.yml
    env_file:
      - ./.env.docker  # Docker infrastructure variables
      - ./apps/backend/.env  # Symfony application variables

  # Frontend dev service
  - path: ./infrastructure/docker/docker-compose.frontend-dev.yml
    env_file:
      - ./.env.docker

  # AI services
  - path: ./infrastructure/docker/docker-compose.ai.yml
    env_file:
      - ./.env.docker

# No services defined here - all in included files

# Environment-specific usage:
# Development: docker-compose -f docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml up -d
#   - Загружает base (БЕЗ fallback) + dev overrides (С fallback)
#   - Fallback разрешены ТОЛЬКО для dev!
# Production: docker-compose -f docker-compose.yml -f infrastructure/docker/docker-compose-prod.yml up -d
#   - Загружает base (БЕЗ fallback) + prod overrides (БЕЗ fallback)
#   - Fallback запрещены - Fail-Fast работает!
#   - Set proper .env.docker.prod and apps/backend/.env.prod files first
