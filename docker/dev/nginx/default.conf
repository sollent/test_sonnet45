server {
    listen 80;

    index index.php;
    server_name localhost;
    root /var/www/backend-app/public;
    
    # Increase upload size limit
    client_max_body_size 20M;

    location / {
            try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
            fastcgi_pass php83-fpm:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 6000; # Увеличить таймаут на чтение ответа от PHP-FPM
            fastcgi_send_timeout 6000; # Увеличить таймаут на отправку запроса к PHP-FPM
            internal;
     }

    location ~ \.php$ {
            return 404;
    }

    error_log /var/log/nginx/backend-app_error.log;
    access_log /var/log/nginx/backend-app_access.log;
}