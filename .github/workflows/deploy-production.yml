name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📢 Send Telegram notification (start)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Деплой начался*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`
            🔗 *Commit:* [${{ github.sha }}](${{ github.event.head_commit.url }})

            📝 *Message:* ${{ github.event.head_commit.message }}

      - name: 🔐 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts

          # Create SSH config to use the deploy key
          cat > ~/.ssh/config << EOF
          Host vds
            HostName ${{ secrets.VDS_HOST }}
            User ${{ secrets.VDS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: 📝 Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "🚀 Starting deployment..."

          # Переход в директорию проекта
          cd ${{ secrets.VDS_PROJECT_PATH }}

          # Обновление кода
          echo "📥 Pulling latest changes..."
          git pull origin main

          # Создание production .env файлов
          echo "🔧 Creating production env files..."

          # Docker env
          cat > .env.docker.prod << EOL
          POSTGRES_DB=backend_prod
          POSTGRES_USER=prod_user
          POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
          POSTGRES_PORT=5432

          RABBITMQ_USER=prod_user
          RABBITMQ_PASSWORD=${{ secrets.PROD_RABBITMQ_PASSWORD }}
          RABBITMQ_PORT=5672
          RABBITMQ_MANAGEMENT_PORT=15672

          NGINX_PORT=80
          PHP_FPM_PORT=9000
          EOL

          # Symfony env
          cat > apps/backend/.env.prod << EOL
          APP_ENV=prod
          APP_SECRET=${{ secrets.PROD_APP_SECRET }}
          APP_DEBUG=false

          DATABASE_URL="postgresql://prod_user:${{ secrets.PROD_POSTGRES_PASSWORD }}@psql16:5432/backend_prod?serverVersion=16&charset=utf8"

          JWT_PASSPHRASE=${{ secrets.PROD_JWT_PASSPHRASE }}

          MESSENGER_TRANSPORT_DSN=amqp://prod_user:${{ secrets.PROD_RABBITMQ_PASSWORD }}@rabbitmq:5672/%2f/messages

          GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          EOL

          # Пересборка и перезапуск контейнеров
          echo "🐳 Building and restarting Docker containers..."
          docker-compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        down

          docker-compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        build --no-cache

          docker-compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        up -d

          # Ожидание запуска контейнеров
          echo "⏳ Waiting for containers to start..."
          sleep 10

          # Установка зависимостей и миграции
          echo "📦 Installing dependencies..."
          docker exec backend-php83 composer install --no-dev --optimize-autoloader

          echo "🔄 Running migrations..."
          docker exec backend-php83 php bin/console doctrine:migrations:migrate --no-interaction

          # Очистка кеша
          echo "🧹 Clearing cache..."
          docker exec backend-php83 php bin/console cache:clear --env=prod
          docker exec backend-php83 php bin/console cache:warmup --env=prod

          # Генерация JWT ключей если их нет
          echo "🔐 Checking JWT keys..."
          docker exec backend-php83 sh -c "[ ! -f config/jwt/private.pem ] && php bin/console lexik:jwt:generate-keypair || echo 'JWT keys exist'"

          echo "✅ Deployment completed!"
          EOF

          chmod +x deploy.sh

      - name: 🚀 Deploy to VDS
        run: |
          scp deploy.sh vds:/tmp/deploy.sh
          ssh vds "bash /tmp/deploy.sh"
          ssh vds "rm /tmp/deploy.sh"

      - name: 🏥 Health Check - HTTP
        run: |
          echo "Checking frontend HTTP status..."
          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s -o /dev/null -w "%{http_code}" https://task.nesty.by | grep -q "200"; then
              echo "✅ Frontend is responding"
              break
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, waiting..."
            sleep 10
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Frontend health check failed"
            exit 1
          fi

      - name: 🏥 Health Check - API
        run: |
          echo "Checking backend API..."
          if curl -f -s https://api.task.nesty.by/api/health | grep -q "ok"; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed"
            exit 1
          fi

      - name: 🏥 Health Check - Database
        run: |
          ssh vds << 'EOF'
          echo "Checking database connection..."
          if docker exec backend-php83 php -r "
            try {
              \$pdo = new PDO('postgresql:host=psql16;port=5432;dbname=backend_prod', 'prod_user', getenv('POSTGRES_PASSWORD'));
              echo '✅ Database connection successful\n';
              exit(0);
            } catch (Exception \$e) {
              echo '❌ Database connection failed: ' . \$e->getMessage() . '\n';
              exit(1);
            }
          "; then
            echo "Database check passed"
          else
            echo "Database check failed"
            exit 1
          fi
          EOF

      - name: 🧪 Smoke Tests
        run: |
          echo "Running smoke tests..."

          # Test login endpoint
          response=$(curl -s -X POST https://api.task.nesty.by/api/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"test"}' \
            -w "\n%{http_code}")

          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" = "401" ] || [ "$http_code" = "400" ]; then
            echo "✅ Login endpoint working (expected auth failure)"
          else
            echo "❌ Login endpoint not responding correctly"
            exit 1
          fi

          # Test tasks endpoint (should require auth)
          response=$(curl -s https://api.task.nesty.by/api/tasks -w "\n%{http_code}")
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" = "401" ]; then
            echo "✅ Tasks endpoint properly secured"
          else
            echo "❌ Tasks endpoint not properly secured"
            exit 1
          fi

          echo "✅ All smoke tests passed"

      - name: 📢 Send Telegram notification (success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Деплой успешно завершен!*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`

            🌐 *Frontend:* [task.nesty.by](https://task.nesty.by)
            🔌 *API:* [api.task.nesty.by](https://api.task.nesty.by)

            ⏱️ *Duration:* ${{ job.duration }}

      - name: 📢 Send Telegram notification (failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Деплой завершился с ошибкой!*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`

            🔗 *Actions:* [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ⚠️ *Требуется ручное вмешательство!*