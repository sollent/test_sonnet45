name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Tests"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    # Запускаем деплой ТОЛЬКО если CI прошел успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📢 Send Telegram notification (start)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Деплой начался*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`
            🔗 *Commit:* `${{ github.sha }}`

      - name: 🔐 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts

          # Debug: Check key format (first/last lines only - не показываем сам ключ!)
          echo "🔍 Checking SSH key format..."
          if head -n 1 ~/.ssh/deploy_key | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "✅ Key starts with BEGIN OPENSSH PRIVATE KEY"
          else
            echo "❌ ERROR: Key does not start with BEGIN OPENSSH PRIVATE KEY"
            echo "First line: $(head -n 1 ~/.ssh/deploy_key)"
            exit 1
          fi

          if tail -n 1 ~/.ssh/deploy_key | grep -q "END OPENSSH PRIVATE KEY"; then
            echo "✅ Key ends with END OPENSSH PRIVATE KEY"
          else
            echo "❌ ERROR: Key does not end with END OPENSSH PRIVATE KEY"
            echo "Last line: $(tail -n 1 ~/.ssh/deploy_key)"
            exit 1
          fi

          # Validate key with ssh-keygen
          if ssh-keygen -l -f ~/.ssh/deploy_key &>/dev/null; then
            echo "✅ Key is valid"
            ssh-keygen -l -f ~/.ssh/deploy_key
          else
            echo "❌ ERROR: Key is invalid or corrupted"
            exit 1
          fi

          # Test SSH connection
          echo "🔌 Testing SSH connection..."
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "echo 'SSH connection successful!'" 2>&1; then
            echo "✅ SSH connection works!"
          else
            echo "❌ ERROR: SSH connection failed"
            echo "Please check:"
            echo "1. Public key is added to VDS ~/.ssh/authorized_keys"
            echo "2. VDS is accessible from GitHub Actions"
            echo "3. SSH service is running on VDS"
            exit 1
          fi

      - name: 📝 Create deployment script
        run: |
          cat > deploy.sh << 'ENDSCRIPT'
          #!/bin/bash
          set -e

          echo "🚀 Starting deployment..."

          cd /var/www/test_sonnet45

          echo "📥 Pulling latest changes..."
          git pull origin main

          echo "🔧 Creating production env files..."

          cat > .env.docker.prod << ENVDOCKER
          POSTGRES_DB=backend_prod
          POSTGRES_USER=prod_user
          POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
          POSTGRES_PORT=5432

          RABBITMQ_USER=prod_user
          RABBITMQ_PASSWORD=${{ secrets.PROD_RABBITMQ_PASSWORD }}
          RABBITMQ_PORT=5672
          RABBITMQ_MANAGEMENT_PORT=15672

          PHP_FPM_PORT=9000
          VITE_API_BASE_URL=https://api.task.nesty.by
          ENVDOCKER

          cat > apps/backend/.env.prod << ENVSYMFONY
          APP_ENV=prod
          APP_SECRET=${{ secrets.PROD_APP_SECRET }}
          APP_DEBUG=false

          DATABASE_URL="postgresql://prod_user:${{ secrets.PROD_POSTGRES_PASSWORD }}@test_sonnet45-psql16:5432/backend_prod?serverVersion=16&charset=utf8"

          JWT_PASSPHRASE=${{ secrets.PROD_JWT_PASSPHRASE }}
          JWT_REFRESH_TOKEN_TTL=2592000
          JWT_REFRESH_TOKEN_TTL_UPDATE=true

          MESSENGER_TRANSPORT_DSN=amqp://prod_user:${{ secrets.PROD_RABBITMQ_PASSWORD }}@test_sonnet45-rabbitmq:5672/%2f/messages

          GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          ENVSYMFONY

          if [ -f apps/backend/.env.prod ]; then
            echo "✅ apps/backend/.env.prod created successfully"
            ls -lh apps/backend/.env.prod
          else
            echo "❌ ERROR: Failed to create apps/backend/.env.prod"
            exit 1
          fi

          echo "🔗 Creating env symlinks..."
          ln -sf .env.docker.prod .env.docker
          ln -sf .env.docker.prod .env

          cd apps/backend
          ln -sf .env.prod .env
          cd ../..

          echo "🐳 Stopping old containers..."
          docker compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        -f infrastructure/docker/docker-compose.frontend-prod.yml \
                        down --remove-orphans

          echo "⏳ Waiting for containers to fully stop..."
          sleep 5

          echo "🔓 Ensuring Docker ports are released..."
          # НЕ убиваем host nginx на порту 80! Он нужен для HTTPS proxy!
          # Убиваем только процессы на Docker портах 8000 и 8089 (если есть)
          lsof -ti:8000 | xargs -r kill -9 2>/dev/null || true
          lsof -ti:8089 | xargs -r kill -9 2>/dev/null || true
          sleep 2

          echo "🔍 Checking if full rebuild is needed..."
          # Smart --no-cache logic: rebuild only if Dockerfile or dependencies changed
          LAST_DEPLOY_FILE=".last_deploy_commit"
          BUILD_FLAGS=""

          if [ -f "$LAST_DEPLOY_FILE" ]; then
            LAST_COMMIT=$(cat "$LAST_DEPLOY_FILE")
            CHANGED_FILES=$(git diff --name-only "$LAST_COMMIT" HEAD 2>/dev/null || echo "")

            if echo "$CHANGED_FILES" | grep -qE "(Dockerfile|composer\.json|package\.json|package-lock\.json|composer\.lock|infrastructure/docker/)"; then
              BUILD_FLAGS="--no-cache"
              echo "⚠️  Dependencies or Dockerfile changed - rebuilding without cache"
            else
              echo "✅ Only code changed - using cache for faster build"
            fi
          else
            BUILD_FLAGS="--no-cache"
            echo "🆕 First deployment - building without cache"
          fi

          echo "🔨 Building containers..."
          docker compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        -f infrastructure/docker/docker-compose.frontend-prod.yml \
                        build $BUILD_FLAGS

          # Save current commit for next deployment
          git rev-parse HEAD > "$LAST_DEPLOY_FILE"

          echo "🚀 Starting containers..."
          docker compose -f docker-compose.yml \
                        -f infrastructure/docker/docker-compose-prod.yml \
                        -f infrastructure/docker/docker-compose.frontend-prod.yml \
                        up -d --force-recreate

          echo "⏳ Waiting for containers to start..."
          sleep 15

          echo "📦 Installing dependencies..."
          docker exec test_sonnet45-php83 composer install --no-dev --optimize-autoloader

          echo "🔄 Updating database schema..."
          # Temporarily using d:s:u instead of migrations
          docker exec test_sonnet45-php83 php bin/console d:s:u --force
          # docker exec test_sonnet45-php83 php bin/console doctrine:migrations:migrate --no-interaction

          echo "🧹 Clearing cache..."
          docker exec test_sonnet45-php83 php bin/console cache:clear --env=prod
          docker exec test_sonnet45-php83 php bin/console cache:warmup --env=prod

          echo "🔒 Setting correct permissions..."
          # Устанавливаем права на директории для записи (кеш, логи, uploads)
          docker exec test_sonnet45-php83 chmod -R 777 var/
          docker exec test_sonnet45-php83 chmod -R 777 public/uploads/
          echo "✅ Permissions set"

          echo "🔐 Checking JWT keys..."
          docker exec test_sonnet45-php83 sh -c "[ ! -f config/jwt/private.pem ] && php bin/console lexik:jwt:generate-keypair || echo 'JWT keys exist'"

          echo "🌐 Checking host nginx status..."
          # Проверяем что host nginx работает (нужен для HTTPS proxy)
          if systemctl is-active --quiet nginx; then
            echo "✅ Host nginx is running"
          else
            echo "⚠️  Host nginx is not running, starting..."
            systemctl start nginx
            if systemctl is-active --quiet nginx; then
              echo "✅ Host nginx started successfully"
            else
              echo "❌ ERROR: Failed to start host nginx"
              exit 1
            fi
          fi

          # Перезагружаем конфигурацию nginx (на случай если были изменения)
          nginx -t && systemctl reload nginx || echo "⚠️  Nginx config test failed, but continuing..."

          echo "✅ Deployment completed!"
          ENDSCRIPT

          chmod +x deploy.sh

      - name: 🚀 Deploy to VDS
        run: |
          # Прямое указание ключа для scp/ssh (если SSH config не работает)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy.sh ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/tmp/deploy.sh
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "bash /tmp/deploy.sh"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "rm /tmp/deploy.sh"

      - name: ⏳ Wait for services to stabilize
        run: |
          echo "Waiting 30 seconds for all services to fully start and stabilize..."
          sleep 30
          echo "✅ Wait complete, proceeding with health checks"

      - name: 🏥 Health Check - HTTP
        run: |
          echo "Checking frontend HTTP status..."
          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" https://task.nesty.by || echo "000")

            if [ "$http_code" = "200" ]; then
              echo "✅ Frontend is responding (HTTP $http_code)"
              break
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: HTTP $http_code (expected 200), waiting 10 seconds..."
            sleep 10
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Frontend health check failed after $max_attempts attempts"
            echo "Last HTTP code: $http_code"
            exit 1
          fi

      - name: 🏥 Health Check - API
        run: |
          echo "Checking backend API..."
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" https://api.task.nesty.by/api/login || echo "000")

            # API должен вернуть 400 или 401 для /api/login без credentials (значит работает!)
            if [ "$http_code" = "400" ] || [ "$http_code" = "401" ]; then
              echo "✅ API is healthy and responding (HTTP $http_code on /api/login)"
              break
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: HTTP $http_code (expected 400/401), waiting 5 seconds..."
            sleep 5
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "❌ API health check failed after $max_attempts attempts"
            echo "Last HTTP code: $http_code"
            exit 1
          fi

      - name: 🏥 Health Check - Database
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} 'bash -s' << 'DBCHECK'
          echo "Checking database connection..."

          # Используем Symfony doctrine команду для проверки подключения к БД
          if docker exec test_sonnet45-php83 php bin/console dbal:run-sql "SELECT 1" --env=prod 2>&1 | grep -q "1"; then
            echo "✅ Database connection successful"
            exit 0
          else
            echo "❌ Database connection failed"
            docker exec test_sonnet45-php83 php bin/console dbal:run-sql "SELECT 1" --env=prod 2>&1
            exit 1
          fi
          DBCHECK

      - name: 🧪 Smoke Tests
        run: |
          echo "Running smoke tests..."

          # Test login endpoint
          response=$(curl -s -X POST https://api.task.nesty.by/api/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"test"}' \
            -w "\n%{http_code}")

          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" = "401" ] || [ "$http_code" = "400" ]; then
            echo "✅ Login endpoint working (expected auth failure)"
          else
            echo "❌ Login endpoint not responding correctly"
            exit 1
          fi

          # Test tasks endpoint (should require auth)
          response=$(curl -s https://api.task.nesty.by/api/tasks -w "\n%{http_code}")
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" = "401" ]; then
            echo "✅ Tasks endpoint properly secured"
          else
            echo "❌ Tasks endpoint not properly secured"
            exit 1
          fi

          echo "✅ All smoke tests passed"

      - name: 📢 Send Telegram notification (success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Деплой успешно завершен!*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`

            🌐 *Frontend:* [task.nesty.by](https://task.nesty.by)
            🔌 *API:* [api.task.nesty.by](https://api.task.nesty.by)

            ⏱️ *Duration:* ${{ job.duration }}

      - name: 📢 Send Telegram notification (failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Деплой завершился с ошибкой!*

            📦 *Repository:* `${{ github.repository }}`
            🔧 *Branch:* `${{ github.ref_name }}`
            👤 *Actor:* `${{ github.actor }}`

            🔗 *Actions:* [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ⚠️ *Требуется ручное вмешательство!*