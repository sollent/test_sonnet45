  # ============================================
  # Centrifugo - WebSocket Service
  # ============================================
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-centrifugo
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
      - "${CENTRIFUGO_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./ai/centrifugo.json:/centrifugo/config.json:ro
    environment:
      - CENTRIFUGO_ADMIN=${CENTRIFUGO_ADMIN:-true}
      - CENTRIFUGO_ADMIN_PASSWORD=${CENTRIFUGO_ADMIN_PASSWORD:-admin}
      - CENTRIFUGO_ADMIN_SECRET=${CENTRIFUGO_ADMIN_SECRET:-secret}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-api-key}
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_SECRET:-secret-key}
    command: centrifugo -c /centrifugo/config.json
    networks:
      - nginx-php83-psql16
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # Redis - Cache for Centrifugo
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes
    networks:
      - nginx-php83-psql16
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  # ⚠️ ЗАКОММЕНТИРОВАНО: Используем нативную установку
  # ollama_models:
  #   driver: local
  # whisper_models:
  #   driver: local
  redis_data:
    driver: local

networks:
  nginx-php83-psql16: