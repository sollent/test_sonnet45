version: '2'

services:
  nginx:
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-nginx
    image: nginx:stable-alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ../../apps/backend:/var/www/backend-app
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php83-fpm
    networks:
      - nginx-php83-psql16
  php83-fpm:
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-php83
    build:
      context: .
      dockerfile: ./dev/php/Dockerfile
    ports:
      - "${PHP_FPM_PORT}:9000"
    volumes:
      - ../../apps/backend:/var/www/backend-app
      - ./dev/php/php.ini-development:/usr/local/etc/php/php.ini
      - ./dev/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    environment:
      PHP_IDE_CONFIG: "serverName=docker.backend-app"
      # Database credentials from .env.docker (БЕЗ fallback - Fail-Fast!)
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # RabbitMQ credentials from .env.docker (БЕЗ fallback - Fail-Fast!)
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Centrifugo configuration
      CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET:-secret-key}
      CENTRIFUGO_API_URL: ${CENTRIFUGO_API_URL:-http://centrifugo:8000/api}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev_api_key_change_in_production}
      CENTRIFUGO_ENABLED: ${CENTRIFUGO_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - nginx-php83-psql16
  psql16:
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-psql16
    image: postgres:16.0-alpine
    environment:
      # БЕЗ fallback - если credentials не заданы, контейнер НЕ запустится!
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - nginx-php83-psql16
    volumes:
      - pgdata:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:management
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"   # порт для AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # порт для веб-интерфейса (management plugin)
    environment:
      # БЕЗ fallback - Fail-Fast!
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - nginx-php83-psql16

  cron:
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-cron
    build:
      context: .
      dockerfile: ./dev/php/Dockerfile
    volumes:
      - ../../apps/backend:/var/www/backend-app
      - ./cron/crontab:/etc/cron.d/app-cron
      - ./dev/php/php.ini-development:/usr/local/etc/php/php.ini
    command: >
      sh -c "
      apt-get update && apt-get install -y cron &&
      chmod 0644 /etc/cron.d/app-cron &&
      crontab /etc/cron.d/app-cron &&
      touch /var/log/cron.log &&
      cron && tail -f /var/log/cron.log
      "
    depends_on:
      - php83-fpm
      - psql16
    networks:
      - nginx-php83-psql16

  # ============================================
  # Frontend Service
  # ============================================
  # Конфигурация frontend определена в:
  # - docker-compose.frontend-dev.yml (для development)
  # - docker-compose.frontend-prod.yml (для production)

networks:
  nginx-php83-psql16:
volumes:
  pgdata: