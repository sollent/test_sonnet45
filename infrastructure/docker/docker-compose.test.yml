# E2E Test Environment Configuration
# Isolated environment for running Playwright E2E tests
# Uses .env.docker.test for configuration
#
# Usage:
#   Local: docker-compose -f infrastructure/docker/docker-compose.test.yml up -d
#   CI/CD: Used automatically by global-setup.ts
#
# Benefits:
# ✅ Isolated test database (separate from dev)
# ✅ Separate ports to avoid conflicts
# ✅ Can run E2E tests without affecting dev environment
# ✅ Automatic cleanup after tests

version: '3.8'

services:
  test-nginx:
    container_name: test-backend-nginx
    image: nginx:stable-alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ../../apps/backend:/var/www/backend-app
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - test-backend
    networks:
      - test-network

  test-backend:
    container_name: test-backend-php83
    build:
      context: .
      dockerfile: ./dev/php/Dockerfile
    ports:
      - "${PHP_FPM_PORT}:9000"
    volumes:
      - ../../apps/backend:/var/www/backend-app
      - ./dev/php/php.ini-development:/usr/local/etc/php/php.ini
    environment:
      # Test environment configuration
      PHP_IDE_CONFIG: "serverName=docker.backend-test"
      APP_ENV: test
      APP_DEBUG: false
      # Database credentials from .env.docker.test
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # RabbitMQ credentials from .env.docker.test
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - test-network
    depends_on:
      - test-psql16
      - test-rabbitmq

  test-psql16:
    container_name: test-backend-psql16
    image: postgres:16.0-alpine
    environment:
      # Test database credentials
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - test-network
    volumes:
      # Separate volume for test data isolation
      - test-pgdata:/var/lib/postgresql/data
    # Health check to ensure database is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-rabbitmq:
    container_name: test-backend-rabbitmq
    image: rabbitmq:management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - test-network
    # Health check to ensure RabbitMQ is ready
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  test-network:
    driver: bridge

volumes:
  # Isolated volume for test database
  # Can be easily cleaned with: docker volume rm infrastructure_test-pgdata
  test-pgdata:
