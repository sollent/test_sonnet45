  <line x1="32" y1="65" x2="48" y2="65" stroke="url(#voiceGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M60 25 C65 30, 65 40, 60 45" stroke="#667eea" stroke-width="2" fill="none" opacity="0.6"/>
