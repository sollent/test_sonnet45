# Nginx конфигурация для Vue.js SPA (Production)
# Оптимизировано для performance, SPA routing и безопасности

server {
    listen 80;
    server_name localhost;

    # Корневая директория со статическими файлами (собранный dist/)
    root /usr/share/nginx/html;
    index index.html;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ============================================
    # Gzip Compression (уменьшает размер на 60-70%)
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ============================================
    # Brotli Compression (лучше чем gzip, если модуль установлен)
    # ============================================
    # Если nginx собран с модулем brotli, раскомментируйте:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript
    #              text/xml application/xml application/xml+rss text/javascript;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ============================================
    # Статические Файлы с Immutable Кешированием
    # ============================================
    # JS/CSS файлы с хешами в имени (например: main-abc123.js)
    # Можно кешировать навсегда, так как при изменении хеш меняется
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Изображения и шрифты
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # Прекешированные файлы (Gzip/Brotli от Vite)
    # ============================================
    location ~* \.(?:gz|br)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # Service Worker и Manifest (НЕ кешируем!)
    # ============================================
    # Service Worker должен обновляться при каждом запросе
    # Иначе пользователи не получат обновления PWA
    location ~* \.(?:sw\.js|workbox.*\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # Proxy /api к Backend
    # ============================================
    location /api {
        # Проксируем все запросы /api/* к backend nginx контейнеру
        proxy_pass http://backend-nginx:80;

        # Передаем заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (защита от долгих запросов)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Отключаем буферизацию для потоковых запросов
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================
    # SPA Routing - Fallback на index.html
    # ============================================
    # КРИТИЧНО для Vue Router в HTML5 History режиме!
    # Без этого прямые переходы на /tasks или /calendar вернут 404
    location / {
        # Сначала пробуем найти файл, затем директорию,
        # если не найдено - возвращаем index.html (SPA routing)
        try_files $uri $uri/ /index.html;

        # НЕ кешируем index.html (может измениться при деплое)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # Обработка Ошибок
    # ============================================
    # 404 - перенаправляем на index.html (SPA обработает)
    error_page 404 /index.html;

    # 5xx ошибки - показываем кастомную страницу
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
